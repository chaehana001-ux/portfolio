<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>딥티크 팀 프로젝트 실시간 미리보기</title>
  <base href="https://mbc-teamproject-alpha.vercel.app/">
  <script>history.replaceState(null, '', location.origin + '/');</script>
  <link rel="stylesheet" crossorigin href="https://mbc-teamproject-alpha.vercel.app/assets/index-aR0QFVdc.css">
  <style>html{scrollbar-width:none!important;scroll-behavior:auto!important}::-webkit-scrollbar{display:none!important}</style>
  <script type="module" crossorigin src="https://mbc-teamproject-alpha.vercel.app/assets/index-DI4pN-zg.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
  (() => {
    let active=false,previous=0,holdUntil=performance.now()+7000,atEnd=false;
    let progress=0,runTime=0,lastHeight=0,heightStableFor=0;
    const reduced=matchMedia('(prefers-reduced-motion: reduce)');
    const playVideos=()=>document.querySelectorAll('video').forEach(video=>{
      video.muted=true;video.playsInline=true;video.playbackRate=1;
      if(active&&!reduced.matches) video.play().catch(()=>{}); else video.pause();
    });
    addEventListener('message',event=>{
      if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='team-preview-visibility')return;
      active=event.data.visible;previous=0;playVideos();
    });
    new MutationObserver(playVideos).observe(document.querySelector('#root'),{childList:true,subtree:true});
    const frame=now=>{
      requestAnimationFrame(frame);
      if(!active||document.hidden||reduced.matches){previous=0;return;}
      const elapsed=previous?Math.min(now-previous,50):0;previous=now;
      if(now<holdUntil)return;
      runTime+=elapsed;
      const height=document.documentElement.scrollHeight;
      heightStableFor=height===lastHeight?heightStableFor+elapsed:0;
      lastHeight=height;
      const bottom=Math.max(0,height-innerHeight);
      if(bottom<100)return;
      if(atEnd){
        progress=0;runTime=0;atEnd=false;
        scrollTo({top:0,behavior:'instant'});holdUntil=now+4500;return;
      }
      // Keep forward progress even when the site's pinning animations adjust scrollY.
      progress=Math.min(bottom,Math.max(progress,scrollY)+elapsed*.65);
      scrollTo({top:progress,behavior:'instant'});
      const footer=document.querySelector('footer');
      const footerBox=footer?.getBoundingClientRect();
      const footerReached=footerBox&&footerBox.height>0&&footerBox.bottom<=innerHeight+4&&footerBox.bottom>0;
      if(footerReached&&progress>=bottom-2&&runTime>20000&&heightStableFor>3000){
        atEnd=true;holdUntil=now+5000;
      }
    };
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
