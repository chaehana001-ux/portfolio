<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>딥티크 팀 프로젝트 실시간 미리보기</title>
  <base href="https://mbc-teamproject-alpha.vercel.app/">
  <script>history.replaceState(null, '', location.origin + '/');</script>
  <link rel="stylesheet" crossorigin href="https://mbc-teamproject-alpha.vercel.app/assets/index-aR0QFVdc.css">
  <style>html{scrollbar-width:none!important;scroll-behavior:auto!important}::-webkit-scrollbar{display:none!important}</style>
  <script type="module" crossorigin src="https://mbc-teamproject-alpha.vercel.app/assets/index-DI4pN-zg.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
  (() => {
    let active=false,previous=0,elapsed=0,hold=800,phase='start';
    let stable=0,lastHeight=0,ready=false;
    const reduced=matchMedia('(prefers-reduced-motion: reduce)');
    const playVideos=()=>document.querySelectorAll('video').forEach(video=>{
      video.muted=true;video.playsInline=true;
      if(active&&!reduced.matches)video.play().catch(()=>{});else video.pause();
    });
    addEventListener('message',event=>{
      if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='team-preview-visibility')return;
      active=Boolean(event.data.visible);previous=0;playVideos();
    });
    parent.postMessage({type:'team-preview-ready'},location.origin);
    new MutationObserver(playVideos).observe(document.querySelector('#root'),{childList:true,subtree:true});
    const frame=now=>{
      requestAnimationFrame(frame);
      const height=document.documentElement.scrollHeight;
      if(!ready){
        stable=height===lastHeight?stable+16:0;lastHeight=height;
        if(document.readyState==='complete'&&document.fonts.status==='loaded'&&document.querySelector('footer')&&height>innerHeight+100&&stable>750){ready=true;scrollTo({top:0,behavior:'instant'});}
        previous=0;return;
      }
      if(!active||document.hidden||reduced.matches){previous=0;return;}
      const delta=previous?now-previous:0;previous=now;
      if(hold>0){hold-=delta;return;}
      if(phase==='end'){
        elapsed=0;phase='start';hold=600;scrollTo({top:0,behavior:'instant'});return;
      }
      elapsed+=delta;
      const progress=Math.min(1,elapsed/3000);
      const bottom=Math.max(0,document.documentElement.scrollHeight-innerHeight);
      scrollTo({top:bottom*progress,behavior:'instant'});
      if(progress===1){
        phase='end';hold=1600;
        parent.postMessage({type:'team-preview-complete',duration:elapsed,scroll:scrollY,bottom},location.origin);
      }
    };
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
